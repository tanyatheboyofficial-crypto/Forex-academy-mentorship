<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050B14'/%3E%3Cpath d='M20 44V20h24' stroke='%2310B981' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M44 44V28' stroke='%2334D399' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">

<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 64 64" width="38" height="38"><rect width="64" height="64" rx="14" fill="#0A1422" stroke="#10B981" stroke-width="2"/><path d="M20 44V20h24" stroke="#10B981" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 44V28" stroke="#34D399" stroke-width="5" stroke-linecap="round"/></svg></span>
      <span class="brand__text"><span class="brand__name">ICEBACK</span><span class="brand__sub">FOREX ACADEMY</span></span>
    </a>
    <nav class="primary-nav" style="margin-left:auto;">
      <ul class="nav-list">
        <li><a class="nav-link" href="index.html">Home</a></li>
        <li><a class="nav-link" href="courses.html">Courses</a></li>
        <li><a class="nav-link is-active" href="contact.html">Contact</a></li>
        <li class="nav-auth">
          <a class="btn btn-ghost btn-sm" href="login.html">Login</a>
          <a class="btn btn-primary btn-sm" href="onboarding.html">Register</a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="page-header">
    <div class="container">
      <h1>Contact Us</h1>
      <p style="color:var(--text-muted);">We are here to help you on your trading journey.</p>
    </div>
  </div>

  <section class="section">
    <div class="container container--narrow">
      <div style="background: var(--navy-900); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px;">
        <h2 style="text-align:center; margin-bottom:30px;">Send us a Direct Message</h2>
        
        <form action="mailto:support@icebackforexacademy.com" method="POST" enctype="text/plain" style="display: grid; gap: 20px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group" style="margin:0;">
              <label>Your Name</label>
              <input type="text" name="name" required placeholder="John Doe" style="width:100%; padding:12px; background:rgba(148,163,184,0.05); border:1px solid var(--border); border-radius:6px; color:var(--text-strong);">
            </div>
            <div class="form-group" style="margin:0;">
              <label>Your Email</label>
              <input type="email" name="email" required placeholder="you@example.com" style="width:100%; padding:12px; background:rgba(148,163,184,0.05); border:1px solid var(--border); border-radius:6px; color:var(--text-strong);">
            </div>
          </div>
          <div class="form-group" style="margin:0;">
            <label>Message</label>
            <textarea name="message" required rows="6" placeholder="How can we help you?" style="width:100%; padding:12px; background:rgba(148,163,184,0.05); border:1px solid var(--border); border-radius:6px; color:var(--text-strong); font-family:inherit; resize:vertical;"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="justify-content:center; padding:16px; font-size:1.1rem;">Send Message</button>
        </form>
        
        <div style="text-align: center; margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--border);">
          <p style="color: var(--text-muted); font-size: 0.95rem; margin: 0;">
            Prefer direct email? Reach us at: <br>
            <a href="mailto:support@icebackforexacademy.com" style="color: var(--emerald-400); font-weight: 700; font-size: 1.2rem;">support@icebackforexacademy.com</a>
          </p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" style="padding: 40px 0; margin-top: 40px;">
  <div class="container" style="text-align:center;">
    <p style="color:var(--text-500);">&copy; 2025 ICEBACK FOREX ACADEMY. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
