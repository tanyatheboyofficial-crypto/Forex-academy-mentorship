<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Dashboard | ICEBACK FOREX ACADEMY</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050B14'/%3E%3Cpath d='M20 44V20h24' stroke='%2310B981' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M44 44V28' stroke='%2334D399' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  .dash-header { padding: 60px 0 40px; border-bottom: 1px solid var(--border); background: rgba(16,185,129,0.02); }
  .dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; padding: 40px 0; }
  @media(max-width: 800px) { .dash-grid { grid-template-columns: 1fr; } }
  .dash-card { background: var(--navy-900); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 30px; }
  html[data-theme="light"] .dash-card { background: #fff; }
  .dash-card h3 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
  .completed-list { list-style: none; padding: 0; margin: 0; }
  .completed-list li { padding: 12px 0; border-bottom: 1px solid var(--border); color: var(--text-200); display: flex; justify-content: space-between; }
  .completed-list li:last-child { border-bottom: none; }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <span class="brand__text"><span class="brand__name">ICEBACK</span><span class="brand__sub">FOREX ACADEMY</span></span>
    </a>
    <nav class="primary-nav" style="margin-left:auto;">
      <ul class="nav-list">
        <li><a class="nav-link" href="courses.html">Courses</a></li>
        <li><button class="btn btn-ghost btn-sm" onclick="window.icebackAuth.logout()">Logout</button></li>
      </ul>
    </nav>
  </div>
</header>

<header class="dash-header">
  <div class="container">
    <h1 style="margin:0; font-size:1.8rem;">Welcome back, <span id="studentName" style="color:var(--emerald-400);">Student</span>!</h1>
    <p style="color:var(--text-muted); margin-top:8px;">Track your progress and continue your Forex education.</p>
  </div>
</header>

<main class="container dash-grid">
  <div class="dash-card">
    <h3>Your Learning Progress</h3>
    <div id="progressContainer">
      <!-- JS injects progress here -->
    </div>
    <a href="courses.html" class="btn btn-primary" style="margin-top:20px;">Continue Learning</a>
  </div>
  
  <div class="dash-card">
    <h3>Account Details</h3>
    <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:5px;">Email:</p>
    <p style="font-family:var(--font-mono); color:var(--text-strong); margin-top:0;" id="studentEmail">-</p>
    
    <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:5px; margin-top:20px;">Support:</p>
    <p style="font-size:0.85rem; line-height:1.6;">Call / WhatsApp:<br>
    <a href="tel:+263788377887" style="color:var(--emerald-400);">+263 78 837 7887</a><br>
    <a href="tel:+263788848481" style="color:var(--emerald-400);">+263 78 884 8481</a></p>
  </div>
</main>

<script src="auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const user = window.icebackAuth.getUser();
    if (!user) {
      window.location.href = "login.html"; // Kick out if not logged in
      return;
    }

    // Set user info
    document.getElementById('studentName').textContent = user.name;
    document.getElementById('studentEmail').textContent = user.email;

    // Check local storage for completed lessons
    const completedList = document.getElementById('progressContainer');
    const completedKeys = Object.keys(localStorage).filter(key => key.startsWith('completed_') && localStorage.getItem(key) === 'true');
    
    if (completedKeys.length === 0) {
      completedList.innerHTML = `<p style="color:var(--text-muted); font-size:0.9rem;">You haven't completed any lessons yet. <a href="courses.html" style="color:var(--emerald-400);">Start learning here!</a></p>`;
    } else {
      let html = `<ul class="completed-list">`;
      completedKeys.forEach(key => {
        const lessonId = key.replace('completed_', '');
        html += `<li><span style="font-weight:600; color:var(--emerald-400);">✓</span> <span>${lessonId.replace(/-/g, ' ').toUpperCase()}</span></li>`;
      });
      html += `</ul>`;
      completedList.innerHTML = html;
    }
  });
</script>
</body>
</html>
